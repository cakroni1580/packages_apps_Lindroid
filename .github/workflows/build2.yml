name: Build LindroidUI (AOSP Soong Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      AOSP_ROOT: ${{ github.workspace }}/aosp

    steps:
      # =========================
      # DEPENDENCIES
      # =========================
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git curl python3 openjdk-17-jdk unzip

      # =========================
      # REPO TOOL
      # =========================
      - name: Install repo
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          
      - name: Free space before build
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h
      # =========================
      # FULL AOSP TREE (MINIMAL USER BUILD)
      # =========================
      - name: Init AOSP
        run: |
          mkdir -p $AOSP_ROOT
          cd $AOSP_ROOT

          repo init -u https://android.googlesource.com/platform/manifest \
            -b android-14.0.0_r1

          repo sync -j2 \
            system/core \
            frameworks/base \
            frameworks/native \
            system/libbase \
            system/logging \
            system/hwservicemanager \
            --force-sync
            

      # =========================
      # COPY APP INTO AOSP TREE
      # =========================
      - name: Inject LindroidUI module (Soong layout fix)
        run: |
          TARGET=$AOSP_ROOT/packages/apps/LindroidUI

          mkdir -p $TARGET

          # Android.bp pindah ke root module
          cp app/src/main/Android.bp $TARGET/

          # Manifest
          cp app/src/main/AndroidManifest.xml $TARGET/

          # Java source
          mkdir -p $TARGET/src/main/java
          cp -r app/src/main/java/* $TARGET/src/main/java/

          # Resources
          mkdir -p $TARGET/src/main/res
          cp -r app/src/main/res/* $TARGET/src/main/res/
      # =========================
      # SETUP BUILD ENV
      # =========================
      - name: Build env setup
        run: |
          cd $AOSP_ROOT
          source build/envsetup.sh
          lunch aosp_arm64-eng

      # =========================
      # BUILD APK VIA SOONG
      # =========================
      - name: Build LindroidUI APK
        run: |
          cd $AOSP_ROOT
          m LindroidUI

          

      # =========================
      # COLLECT OUTPUT
      # =========================
      - name: Collect APK
        run: |
          mkdir -p out
          find $AOSP_ROOT/out -name "*.apk" -exec cp {} out/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LindroidUI-AOSP
          path: out
