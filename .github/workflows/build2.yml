name: Build LindroidUI (NDK + Partial AOSP Headers Clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      AOSP_ROOT: ${{ github.workspace }}/aosp

    steps:
      # =========================
      # SOURCE ONLY
      # =========================
      - name: Checkout App Source
        uses: actions/checkout@v4

      # =========================
      # JDK 17
      # =========================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================
      # BASIC TOOLING
      # =========================
      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y git curl python3 unzip wget

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          repo --version

      # =========================
      # ANDROID SDK + NDK (UNCHANGED STYLE)
      # =========================
      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-*.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      # =========================
      # MINIMAL AOSP HEADERS ONLY (FIXED MODEL)
      # =========================
      - name: Init Partial AOSP (HEADERS ONLY SAFE MODE)
        run: |
          mkdir -p $AOSP_ROOT
          cd $AOSP_ROOT

          repo init -u https://android.googlesource.com/platform/manifest \
            -b android-14.0.0_r1 --depth=1

          # ONLY HEADER-RELEVANT MODULES (NO FRAMEWORK FULL SYNC)
          repo sync -j$(nproc --all) \
            system/core \
            system/libbase \
            system/logging \
            system/libhidl \
            system/libhwbinder \
            system/hwservicemanager \
            prebuilts/vndk/v30 \
            prebuilts/vndk/v31 \
            prebuilts/vndk/v32 \
            system/extras \
            frameworks/native \
            --force-sync --no-tags --no-clone-bundle

      # =========================
      # FORCE CLEAN SDK LINK
      # =========================
      - name: Configure SDK Isolation
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_SDK_HOME=" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # =========================
      # BUILD APK
      # =========================
      - name: Build APK (NDK + JNI)
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      # =========================
      # COLLECT OUTPUT
      # =========================
      - name: Collect APK
        run: |
          mkdir -p out
          find . -name "*.apk" -exec cp {} out/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LindroidUI-APK
          path: out
