name: Build LindroidUI (NDK + Partial AOSP Headers)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      AOSP_ROOT: ${{ github.workspace }}/aosp

    steps:
      - name: Checkout app source only
        uses: actions/checkout@v4

      # =========================
      # JDK 17
      # =========================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install repo (stable)
        run: |
         sudo apt update
         sudo apt install -y git curl python3

         curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
         chmod +x /usr/local/bin/repo

         repo --version        
      # =========================
      # SDK + NDK
      # =========================
      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-*.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      # =========================
      # PARTIAL AOSP SYNC (NO FULL GIT CLONE MANUAL)
      # =========================
      - name: Init AOSP minimal manifest
        run: |
          mkdir -p $AOSP_ROOT
          cd $AOSP_ROOT

          repo init -u https://android.googlesource.com/platform/manifest \
            -b android-14.0.0_r1 --depth=1

          # ONLY SYSTEM CORE + BINDER + FRAMEWORK HEADERS (partial sync)
          repo sync -j$(nproc --all) \
            system/core \
            frameworks/native \
            system/libbase \
            system/libbinder \
            --force-sync --no-tags --no-clone-bundle

      # =========================
      # VERIFY JNI PREBUILT
      # =========================
      - name: Check JNI libs
        run: |
          ls -R app/src/main/jniLibs || true

      # =========================
      # BUILD APK ONLY
      # =========================
      - name: Build APK (NDK-only)
        run: |
          export HOME
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT

          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      # =========================
      # COLLECT OUTPUT
      # =========================
      - name: Collect APK
        run: |
          mkdir -p out
          find . -name "*.apk" -exec cp {} out/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LindroidUI-APK
          path: out
