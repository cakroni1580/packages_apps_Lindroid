name: Build LindroidUI (NDK APK Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================
      # JDK 17 (FIX JAVA CLASS 61.0 ERROR)
      # =========================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # =========================
      # ANDROID SDK CLI
      # =========================
      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-*.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      # =========================
      # CHECK PREBUILT JNI
      # =========================
      - name: Verify JNI prebuilt
        run: |
          ls -R app/src/main/jniLibs || true
          file app/src/main/jniLibs/arm64-v8a/libjni_lindroidui.so

      # =========================
      # BUILD APK ONLY (NO AOSP, NO SOONG)
      # =========================
      - name: Build APK (NDK-only)
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      # =========================
      # COLLECT OUTPUT
      # =========================
      - name: Collect APK
        run: |
          mkdir -p out
          find . -name "*.apk" -exec cp {} out/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LindroidUI-APK
          path: out
